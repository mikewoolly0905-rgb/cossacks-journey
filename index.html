              </div>
            </div>
          </div>
        </div>

        <!-- Strike Critical Window & Prompt Center -->
        <div class="my-auto text-center px-2">
          <!-- Critical Reaction Bar -->
          <div class="w-full h-2 bg-stone-800 rounded-full overflow-hidden border border-amber-900/60 mb-3">
            <div id="crit-timer-bar" class="h-full bg-amber-400 w-0 transition-all duration-75"></div>
          </div>

          <div class="bg-stone-900/80 border border-amber-800/40 rounded-2xl p-4 shadow-inner">
            <div id="combat-target-symbol" class="text-4xl font-extrabold font-fantasy text-amber-400 mb-1">В</div>
            <p id="combat-target-hint" class="text-xs text-stone-400 font-mono">Hint: /v/ sound</p>
          </div>

          <!-- Answer Options -->
          <div id="combat-options-grid" class="grid grid-cols-3 gap-2 mt-3"></div>
        </div>

        <!-- Dynamic Parry Intercept Prompt (Appears on Enemy Turn) -->
        <div id="parry-prompt-box" class="absolute inset-x-4 top-1/3 p-4 bg-rose-950/95 border-2 border-rose-500 rounded-2xl text-center shadow-2xl z-40 hidden">
          <span class="text-xs uppercase tracking-widest text-rose-300 font-mono font-bold animate-pulse">Incoming Strike!</span>
          <h3 class="text-lg font-fantasy text-white font-extrabold mt-1 mb-2">PARRY NOW!</h3>
          <button id="btn-parry-action" class="w-full py-3 bg-rose-600 hover:bg-rose-500 border border-rose-300 text-white font-fantasy font-black text-sm rounded-xl uppercase tracking-wider active:scale-95 shadow-lg">
            🛡️ DEFLECT SABRE
          </button>
        </div>

        <!-- Player Action Toolbar: Quick, Cleave, Elixir -->
        <div class="pt-2 border-t border-amber-950/80">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] text-amber-500 font-mono uppercase">Momentum:</span>
              <div id="pip-1" class="w-3.5 h-3.5 rounded-full bg-stone-800 border border-stone-700"></div>
              <div id="pip-2" class="w-3.5 h-3.5 rounded-full bg-stone-800 border border-stone-700"></div>
              <div id="pip-3" class="w-3.5 h-3.5 rounded-full bg-stone-800 border border-stone-700"></div>
            </div>
            <button id="btn-use-elixir" class="px-2.5 py-1 bg-stone-900 border border-emerald-800 text-emerald-300 text-xs rounded-lg active:scale-95 font-mono">
              🧪 Drink Elixir (+35)
            </button>
          </div>

          <div class="flex gap-2">
            <button id="btn-unleash" class="flex-1 py-3 bg-amber-700 hover:bg-amber-600 border border-amber-500 rounded-2xl text-amber-100 font-fantasy font-bold text-xs uppercase tracking-wider active:scale-95">
              ⚔️ Strike Ready
            </button>
            <button id="btn-cleave" class="flex-1 py-3 bg-stone-900 border border-stone-800 text-stone-600 rounded-2xl font-fantasy font-bold text-xs uppercase tracking-wider cursor-not-allowed">
              ⚡ Runic Cleave
            </button>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- MODULAR DEPENDENCY SCRIPTS -->
  <!-- 1. Pure Data First -->
  <script src="data.js"></script>
  <!-- 2. Logic, Camp & Combat Engine Second -->
  <script src="game.js"></script>
</body>
</html>
